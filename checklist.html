<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checklist | GreenFix — Sustainable Living Hub</title>
  <meta name="description" content="Practical tips and guides for sustainable living." />
  <link rel="preload" href="style.css" as="style">
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body class="theme-auto">
<header class="site-header">
  <div class="container row space-between align-center">
    <a class="logo" href="index.html">GreenFix</a>
    <nav id="nav" class="nav">
      <button class="nav-toggle" aria-label="Toggle menu" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="articles.html">Articles</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="checklist.html">Checklist</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="actions">
      <button id="themeBtn" class="btn ghost" onclick="toggleTheme()" aria-label="Toggle theme">🌓</button>
    </div>
  </div>
</header>
<main class="container">
<section>
  <h1>Starter Checklist (7 days)</h1>
  <p class="muted">Tick items as you complete them; your progress saves in your browser.</p>
  <ul class="checklist" id="checklist">
    <li><label><input type="checkbox" data-key="thermostat"> Set thermostat to 19–20°C</label></li>
    <li><label><input type="checkbox" data-key="led"> Replace 3 bulbs with LEDs</label></li>
    <li><label><input type="checkbox" data-key="wash30"> Wash next load at 30°C</label></li>
    <li><label><input type="checkbox" data-key="compost"> Start a countertop compost jar</label></li>
    <li><label><input type="checkbox" data-key="bag"> Pack a tote + bottle before leaving</label></li>
    <li><label><input type="checkbox" data-key="strip"> Add a smart power strip</label></li>
  </ul>
  <div class="card">
    <p><strong>Progress:</strong> <span id="progress">0/6</span></p>
  </div>
</section>
</main>
<footer class="site-footer">
  <div class="container">
    <form id="newsletter" class="newsletter" onsubmit="return subscribe(event)">
      <label for="email">Get eco tips in your inbox</label>
      <div class="row">
        <input type="email" id="email" placeholder="you@example.com" required />
        <button class="btn" type="submit">Subscribe</button>
      </div>
      <p id="news-msg" class="muted small" aria-live="polite"></p>
    </form>
    <div class="footer-meta row space-between align-center">
      <p class="muted small">© 2025 GreenFix. All rights reserved.</p>
      <p class="muted small"><a href="privacy.html">Privacy</a></p>
    </div>
  </div>
</footer>
</body>
</html>
